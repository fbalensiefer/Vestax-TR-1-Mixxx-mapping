name: Validate mapping
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --check Vestax-TR-1-scripts.js
      - run: node tests/test-mapping.js
      - run: python3 tests/test_xml.py
      - run: python3 rekordbox/test_rekordbox.py
